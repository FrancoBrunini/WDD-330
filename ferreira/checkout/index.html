<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout | Ferreira Sports</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <header id="main-header"></header>

    <main class="divider">
      <h2>Review & Place Your Order</h2>

      <div class="checkout-container">
        <form id="checkout-form" name="checkout">
          <fieldset>
            <legend>Shipping Address</legend>
            
            <label for="fname">First Name</label>
            <input type="text" id="fname" name="fname" required />

            <label for="lname">Last Name</label>
            <input type="text" id="lname" name="lname" required />

            <label for="street">Street Address</label>
            <input type="text" id="street" name="street" required />

            <label for="city">City</label>
            <input type="text" id="city" name="city" required />

            <label for="state">State / Province</label>
            <input type="text" id="state" name="state" required />

            <label for="zip">Zip / Postal Code</label>
            <input type="text" id="zip" name="zip" required />
          </fieldset>

          <fieldset>
            <legend>Payment Details</legend>

            <label for="cardNumber">Credit Card Number</label>
            <input type="text" id="cardNumber" name="cardNumber" placeholder="1234123412341234" required />

            <label for="expiration">Expiration Date (MM/YY)</label>
            <input type="text" id="expiration" name="expiration" placeholder="12/26" required />

            <label for="code">Security Code (CVC)</label>
            <input type="text" id="code" name="code" placeholder="123" required />
          </fieldset>

          <button type="submit" id="checkout-submit" class="btn-checkout">Checkout</button>
        </form>

        <section id="order-summary" class="order-summary">
  <h3>Order Summary</h3>
  <p>Items Subtotal (<span id="num-items">0</span>): <span id="subtotal">$0.00</span></p>
  <p>Discount: <span id="discount">-$0.00</span></p> <!-- LÍNEA AGREGADA -->
  <p>Shipping Estimate: <span id="shipping">$0.00</span></p>
  <p>Tax (6%): <span id="tax">$0.00</span></p>
  <h4>Order Total: <span id="orderTotal">$0.00</span></h4>
</section>
      </div>
    </main>

    <footer id="main-footer"></footer>

    <script src="./checkout.js" type="module"></script>
  </body>
</html>
