<main class="divider">
  <h2>Review & Place your Order</h2>
  <link rel="stylesheet" href="../css/style.css" />
  <section class="order-summary">
    <h3>Order Summary</h3>
    <ul>
      <li>Item Subtotal (<span id="num-items">0</span>): <span id="subtotal">$0.00</span></li>
      <li>Shipping Estimate: <span id="shipping">$0.00</span></li>
      <li>Tax: <span id="tax">$0.00</span></li>
      <li>Order Total: <span id="orderTotal">$0.00</span></li>
    </ul>
  </section>

  <form id="checkout-form" name="checkout">
    <fieldset>
      <legend>Shipping Address</legend>
      <label>First Name: <input type="text" name="fname" required ></label>
      <label>Last Name: <input type="text" name="lname" required ></label>
      <label>Street: <input type="text" name="street" required ></label>
      <label>City: <input type="text" name="city" required ></label>
      <label>State: <input type="text" name="state" required ></label>
      <label>Zip: <input type="text" name="zip" id="zip" required ></label>
    </fieldset>

    <fieldset>
      <legend>Payment Information</legend>
      <label>Card Number: <input type="text" name="cardNumber" required ></label>
      <label>Expiration: <input type="text" name="expiration" ></label>
      <label>Security Code: <input type="text" name="code" ></label>
    </fieldset>

    <button type="submit" id="checkoutSubmit">Checkout</button>
<script type="module" src="../js/checkout.js"></script>
  </form>
</main>
